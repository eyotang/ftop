name: Prepare desktop release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang cmake libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/release-manifest.py "$version" dist
          tag="v${version}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/is-draft; then
            test "$(cat /tmp/is-draft)" = true
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ftop $tag" --notes-file "docs/releases/v${version}.md"
          fi
          gh release upload "$tag" dist/* --clobber
