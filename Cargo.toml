[package]
name = "ftop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A quiet, native cross-platform system monitor built with GPUI Kit"

[dependencies]
gpui-kit = { version = "=0.7.3", default-features = false, features = ["assets"] }
sysinfo = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
async-channel = "2"
sys-locale = "=0.3.2"

[profile.release]
lto = "thin"
strip = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls", "json"]

[build-dependencies]
cc = "1"

[dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = "=0.8.9"
